change:
  id: DEMO-101
  title: Scale and release checkout API in production
  service: checkout-api
  environment: production
  change_type: infrastructure
  requested_by: demo-platform-team
  description: Deploy checkout-api 1.1.0 and increase production compute capacity.
  rollback_plan: >-
    Redeploy checkout-api 1.0.0 and restore the e2-standard-2 instance shape if
    error rate exceeds 1 percent or latency exceeds 500 ms for 5 minutes. The
    payments-platform on-call owns the rollback; expected duration is 10 minutes.
  monitoring_plan:
    dashboards:
      - https://grafana.example.com/d/checkout-api
    alerts:
      - checkout-api-error-rate
    validation_window: 30 minutes
    success_criteria:
      - Error rate remains below 1 percent.
  validation_plan:
    - Confirm all production health and readiness endpoints return HTTP 200.
    - Complete five synthetic checkout transactions without elevated latency.
