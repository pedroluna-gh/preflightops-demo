services:
  - name: checkout-api
    description: Handles customer checkout orchestration
    owner: payments-platform
    criticality: high
    tier: tier-1
    environment: production
    cloud_provider: gcp
    runtime: kubernetes
    runbook: https://example.com/runbooks/checkout-api
    rollback_required: true
    monitoring_required: true
    approval_required: true
    dependencies:
      - payments-api
      - inventory-api
    business_impact: Customers cannot complete checkout while the service is unavailable.
