name: PreflightOps change review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preflightops-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Operational change review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Assess change risk
        id: assess
        uses: pedroluna-gh/preflightops@v0.3.0
        with:
          services: services.yaml
          change: change.yaml
          output: preflightops-report.md
          json-output: preflightops-report.json
          html-output: preflightops-report.html
          github-comment-output: preflightops-comment.md
          fail-on: critical

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflightops-change-review
          path: |
            preflightops-report.md
            preflightops-report.json
            preflightops-report.html
            preflightops-comment.md
          if-no-files-found: error

      - name: Create or update pull-request comment
        if: always() && hashFiles('preflightops-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- preflightops-report -->';
            const body = fs.readFileSync('preflightops-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
